yaml
name: Daily FX post

on:
  schedule:
    - cron: "0 6 * * *"   # каждый день в 06:00 UTC = 09:00 по Киеву
  workflow_dispatch:       # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Save updated site
        run: |
          git config user.name "fx-bot"
          git config user.email "fx-bot@users.noreply.github.com"
          git add docs
          git commit -m "Update $(date +%F)" || echo "no changes"
          git push
