name: CFO clubs digest

on:
  schedule:
    - cron: "0 7 * * *"   # каждый день в 07:00 UTC = 10:00 по Киеву
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python digest.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD }}
          MAX_CHECKS: ${{ vars.MAX_CHECKS }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      - name: Save state and site
        if: always()
        run: |
          git config user.name "cfo-digest"
          git config user.email "cfo-digest@users.noreply.github.com"
          git add state.json docs || true
          git commit -m "Clubs digest $(date +%F)" || echo "no changes"
          git pull --rebase
          git push
