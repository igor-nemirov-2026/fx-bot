
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Курсы НБУ на 12.11.2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#f6f5f1; --card:#fff; --ink:#1c1c1a; --muted:#6b6a64; --line:#e4e2da; --usd:#2a7a4b; --eur:#2f5aa8; --up:#b33a2b; --down:#2a7a4b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141413; --card:#1e1e1c; --ink:#ecebe6; --muted:#9a998f; --line:#33322e; --usd:#5fbf86; --eur:#7aa2ec; } }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:860px; margin:0 auto; padding:32px 16px 48px; }
  h1 { font-size:28px; margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; }
  .code { color:var(--muted); font-size:14px; letter-spacing:.05em; }
  .rate { font-size:34px; font-weight:650; font-variant-numeric:tabular-nums; }
  .chg { font-size:14px; } .up { color:var(--up) } .down { color:var(--down) }
  .chart { margin-top:16px; height:320px; }
  .joke { white-space:normal; font-size:17px; }
  footer { color:var(--muted); font-size:13px; margin-top:24px; }
</style>
</head>
<body>
<main>
  <h1>Курсы валют НБУ</h1>
  <p class="sub">Официальные курсы на 12.11.2026 · обновляется автоматически каждое утро</p>
  <div class="grid" id="cards"></div>
  <div class="card chart"><canvas id="c"></canvas></div>
  <div class="card" style="margin-top:16px">
    <div class="code">АНЕКДОТ ДНЯ</div>
    <p class="joke">— Почему ты держишь деньги в банке из-под огурцов?<br>— Там хоть процент соли гарантирован.</p>
  </div>
 <footer>Источник: bank.gov.ua (Национальный банк Украины) · <a href="clubs.html" style="color:var(--eur);font-weight:600">Новости клубов CFO →</a></footer>
</main>
<script>
const D = {"hist": {"USD": [["2026-10-14", 45.0802], ["2026-10-15", 44.9801], ["2026-10-16", 44.8871], ["2026-10-17", 44.8871], ["2026-10-18", 44.8871], ["2026-10-19", 44.8625], ["2026-10-20", 45.0013], ["2026-10-21", 45.0791], ["2026-10-22", 45.0256], ["2026-10-23", 45.051], ["2026-10-24", 45.051], ["2026-10-25", 45.051], ["2026-10-26", 45.2021], ["2026-10-27", 45.5382], ["2026-10-28", 45.6008], ["2026-10-29", 45.5923], ["2026-10-30", 45.5293], ["2026-10-31", 45.5293], ["2026-11-01", 45.5293], ["2026-11-02", 45.3526], ["2026-11-03", 45.5348], ["2026-11-04", 45.666], ["2026-11-05", 45.5375], ["2026-11-06", 45.4432], ["2026-11-07", 45.4432], ["2026-11-08", 45.4432], ["2026-11-09", 45.3206], ["2026-11-10", 45.4123], ["2026-11-11", 45.5013], ["2026-11-12", 45.3222]], "EUR": [["2026-10-14", 50.438], ["2026-10-15", 50.3453], ["2026-10-16", 50.3081], ["2026-10-17", 50.3081], ["2026-10-18", 50.3081], ["2026-10-19", 50.4977], ["2026-10-20", 50.5311], ["2026-10-21", 50.5301], ["2026-10-22", 50.5601], ["2026-10-23", 50.435], ["2026-10-24", 50.435], ["2026-10-25", 50.435], ["2026-10-26", 50.5766], ["2026-10-27", 50.9527], ["2026-10-28", 50.8522], ["2026-10-29", 50.7666], ["2026-10-30", 50.6796], ["2026-10-31", 50.6796], ["2026-11-01", 50.6796], ["2026-11-02", 50.6843], ["2026-11-03", 51.0527], ["2026-11-04", 51.0582], ["2026-11-05", 51.2489], ["2026-11-06", 51.0406], ["2026-11-07", 51.0406], ["2026-11-08", 51.0406], ["2026-11-09", 50.6455], ["2026-11-10", 50.8152], ["2026-11-11", 51.0795], ["2026-11-12", 50.4823]]}, "summary": {"USD": {"today": 45.3222, "day_change": -0.17909999999999826, "month_change_pct": 0.5368210433849052}, "EUR": {"today": 50.4823, "day_change": -0.5972000000000008, "month_change_pct": 0.08783060390975539}}};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const cards = document.getElementById('cards');
for (const [code, v] of Object.entries(D.summary)) {
  const cls = v.day_change > 0 ? 'up' : 'down';
  cards.insertAdjacentHTML('beforeend', `<div class="card">
    <div class="code">${code} / UAH</div>
    <div class="rate">${v.today.toFixed(4)} ₴</div>
    <div class="chg ${cls}">${v.day_change >= 0 ? '+' : ''}${v.day_change.toFixed(4)} за день ·
      ${v.month_change_pct >= 0 ? '+' : ''}${v.month_change_pct.toFixed(2)}% за месяц</div></div>`);
}
const labels = D.hist.USD.map(r => r[0].slice(5));
new Chart(document.getElementById('c'), {
  type: 'line',
  data: { labels, datasets: Object.entries(D.hist).map(([code, rows]) => ({
    label: code, data: rows.map(r => r[1]), borderColor: css('--' + code.toLowerCase()),
    pointRadius: 0, tension: .25, borderWidth: 2, yAxisID: code })) },
  options: { maintainAspectRatio:false, interaction:{mode:'index', intersect:false},
    plugins:{ legend:{ labels:{ color: css('--muted') } } },
    scales: { x:{ ticks:{color:css('--muted'), maxTicksLimit:8}, grid:{display:false} },
      USD:{ position:'left',  ticks:{color:css('--usd')}, grid:{color:css('--line')} },
      EUR:{ position:'right', ticks:{color:css('--eur')}, grid:{display:false} } } }
});
</script>
</body>
</html>
